name: Daily news collection

on:
  schedule:
    - cron: "17 22 * * 1-5"   # 22:17 UTC on weekdays, after the US market close
  workflow_dispatch: {}        # also allows a manual run from the Actions tab

permissions:
  contents: write              # needed to commit the new data back to the repo

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache FinBERT model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: finbert-v1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch, score and save
        run: python scripts/collect.py

      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daily data update $(date -u +%Y-%m-%d)"
          git push
